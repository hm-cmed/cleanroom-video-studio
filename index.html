<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クリーンルーム動画スタジオ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="医療者教育・医療広報のショート動画を、著作権に配慮したクリーンルーム方式（事実カード→台本→照合→監修→動画）でブラウザだけで作るツール">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* レイアウト：左に工程の縦並び（スマホでは上の横スクロール）、右に作業面。カルテの記入欄のような落ち着いた面構成 */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --sunken:#E3EBE9; --ink:#15313A; --muted:#566B70; --line:#CFDCD9;
  --accent:#1F7A8C; --accent-ink:#FFFFFF; --accent-soft:#D7ECEF; --warm:#C4572E; --warm-soft:#F8E3D9;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --ng:#B3261E; --ng-soft:#F9DEDC; --code:#E6EEEC;
  --f-display:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E191C; --surface:#152429; --sunken:#1B2E34; --ink:#E1ECEA; --muted:#9BB0B3; --line:#2A3F45;
  --accent:#55B6C7; --accent-ink:#0E191C; --accent-soft:#1D3A41; --warm:#F08A5D; --warm-soft:#3A2419;
  --ok:#6CC48F; --ok-soft:#183126; --ng:#FF8A80; --ng-soft:#3A1C1A; --code:#1A2C31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E191C; --surface:#152429; --sunken:#1B2E34; --ink:#E1ECEA; --muted:#9BB0B3; --line:#2A3F45;
  --accent:#55B6C7; --accent-ink:#0E191C; --accent-soft:#1D3A41; --warm:#F08A5D; --warm-soft:#3A2419;
  --ok:#6CC48F; --ok-soft:#183126; --ng:#FF8A80; --ng-soft:#3A1C1A; --code:#1A2C31; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:1.25rem;font-weight:900;letter-spacing:.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
code,pre,textarea.mono{font-family:var(--f-mono);font-size:.85rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:12px 40px;display:grid;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;padding-block:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand small{color:var(--muted);font-size:.8rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:4px}
nav.steps button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink)}
nav.steps button:hover{background:var(--sunken)}
nav.steps button[aria-current="step"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
nav.steps .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;border:1.5px solid var(--line);background:var(--bg)}
nav.steps button[data-done="1"] .no{background:var(--ok);border-color:var(--ok);color:var(--surface)}
nav.steps button[aria-current="step"] .no{border-color:var(--accent);color:var(--accent)}
nav.steps button[aria-current="step"][data-done="1"] .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.steps .lbl{display:grid;line-height:1.3}
nav.steps .lbl small{color:var(--muted);font-size:.75rem}
nav.steps hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
main{min-width:0;display:grid;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.panel.quiet{background:transparent;border-style:dashed}
.lead{color:var(--muted);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
label.f{display:grid;gap:4px;font-weight:700;font-size:.9rem;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:120px;resize:vertical;line-height:1.6}
textarea.tall{min-height:260px}
button.b,label.b{white-space:nowrap;font:inherit;font-weight:700;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.b:hover,label.b:hover{border-color:var(--accent)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b.warn{border-color:var(--warm);color:var(--warm)}
button.b.small,label.b.small{padding:4px 10px;font-size:.85rem}
button.b:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--sunken);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ng{background:var(--ng-soft);color:var(--ng);border-color:transparent}
.chip.warn{background:var(--warm-soft);color:var(--warm);border-color:transparent}
.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{background:var(--sunken);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--f-mono);font-size:.8rem;white-space:nowrap}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.note.warn{border-color:var(--warm);background:var(--warm-soft)}
.note.ng{border-color:var(--ng);background:var(--ng-soft)}
.prompt{position:relative;display:grid;gap:8px}
.prompt pre{margin:0;max-height:340px;overflow:auto;background:var(--code);border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-word}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;counter-reset:f}
.flow div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:.85rem;line-height:1.5}
.flow b{display:block;font-family:var(--f-display);font-size:.95rem}
.flow .who{display:inline-block;margin-top:6px}
.scene{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.scene .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.checks li{margin-block:2px}
.checks{margin:0;padding-left:1.2em}
.player{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.player canvas{width:100%;max-width:300px;aspect-ratio:9/16;border-radius:12px;border:1px solid var(--line);background:#F7F4EE;display:block}
.ep{display:grid;gap:10px;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg)}
.ep .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cardlist{display:flex;flex-wrap:wrap;gap:6px}
.cardpick{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface)}
.progress{height:8px;background:var(--sunken);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
footer.fund{border-top:1px solid var(--line);padding-block:18px;display:grid;gap:6px;color:var(--muted);font-size:.85rem}
footer.fund strong{color:var(--ink)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;z-index:20;max-width:min(420px,calc(100vw - 32px))}
details summary{cursor:pointer;font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.steps{position:static;display:flex;overflow-x:auto;gap:4px;padding-bottom:6px}
  nav.steps button{grid-template-columns:24px auto;white-space:nowrap}
  nav.steps .lbl small,nav.steps hr{display:none}
  .grid2,.grid3,.player{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>クリーンルーム動画スタジオ</h1>
      <small>事実カードから、監修済みの医療ショート動画シリーズを作る</small>
    </div>
    <div class="toolbar">
      <button class="b small" id="btn-export-project" type="button">作業を保存（ファイル）</button>
      <label class="b small" for="file-import-project" style="display:inline-flex;align-items:center">作業を読み込む</label>
      <input id="file-import-project" type="file" accept=".json,application/json" hidden>
      <button class="b small warn" id="btn-reset" type="button">はじめからやり直す</button>
    </div>
  </header>

  <div class="layout">
    <nav class="steps" id="steps" aria-label="作業の工程"></nav>
    <main id="main"></main>
  </div>

  <footer class="fund" id="footer"></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="config.js"></script>
<script src="sample.js"></script>
<script src="prompts.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
